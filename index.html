<!DOCTYPE html>
<html lang="en">
<head>
    <title>teehee memes</title>
    <!-- 1 for the camera, 2 for the hands so i don't have to make it -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

    <style>
        html,
        body {
            /* background stuff*/
            margin: 0;
            width: 100%;
            height: 100%;
            background: #21295c;
        }

        body {
            /* for the paint thing centering*/
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .paint {
            position: relative; /* so i can put the cam in the photo*/
            width: min(88vw, 820px);
            aspect-ratio: 1 / 1;
            background-image: url("https://i.postimg.cc/J7Zv6PR5/(7).jpg");
            background-size: 100% 100%;
        }

        #webcam { /* # is bc its once, . is infinate so it refreshes*/
            position: absolute; /* make it fit in the paint*/
            left: 15.5%;
            top: 10.5%;
            width: 83.5%;
            height: 65.5%;
            object-fit: cover;
            transform: scaleX(-1);
        }

        #meme-overlay {
            position: absolute; /* puts the meme in place*/
            left: 20%;
            top: 15%;
            width: 30%;
            height: 30%;
            display: none; /* so its invisable when no hand*/
            object-fit: cover;
            z-index: 5;
        }
    </style>
</head>

<body>
    <div class="paint"> <!--the html part for the css part-->
        <!--creates the cam and a thing to control the memes-->
        <video 
            id="webcam" 
            autoplay
            playsinline>
        </video>

        <img
            id="meme-overlay"
            src=""

    </div>
    <script>
        //so js can now use the things i made and control the pics
        const videoElement = document.getElementById("webcam");
        const memeOverlay = document.getElementById("meme-overlay");
        //links the pics to a variable
        const memeFiles = {
            point: "pointHand.jpeg", open: "openHand.jpeg", cool: "coolHand.jpeg", fist: "interlockedHand.jpeg", question: "questionHand.jpeg", shocked: "shockedHand.jpeg"
        };
        const hands = new Hands({ //this is the mediapipe, its starting it
            locateFile: (file) => {
                return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`; //this is their preexisitg thing so i don't have to code it myself lmfao
            }
        });

        hands.setOptions({ //starts detecting
            maxNumHands: 1, //one hand at a time
            modelComplexity: 1,
            minDetectionConfidence: 0.7, //its condifence in what it saw
            minTrackingConfidence: 0.7
        });

        hands.onResults((results) => { //run dis when mediapipe is done piping

            let activeMeme = null;//stores it

            if ( //if there is a hand
                results.multiHandLandmarks && 
                results.multiHandLandmarks.length > 0
            ) {

                const landmarks = results.multiHandLandmarks[0]; //first hand
                const indexUp =
                    landmarks[8].y < landmarks[6].y; 
                    // fingertip.      //lower part of finger
                const middleUp =
                    landmarks[12].y < landmarks[10].y;
                        //middle fingertip  //lower fingertip
                const ringUp =
                    landmarks[16].y < landmarks[14].y;
                        //ring tip.       //ring lower tip
                const pinkyUp =
                    landmarks[20].y < landmarks[18].y;
                        //pinky tip.     //pinky tink up
                if (
                    indexUp && !middleUp && !ringUp && !pinkyUp
                ) {
                    activeMeme = "point";
                }

                else if (
                    indexUp && middleUp && ringUp && pinkyUp
                ) {
                    activeMeme = "open";
                }

                else if (
                    pinkyUp && !indexUp && !middleUp && !ringUp
                ) {
                    activeMeme = "cool";
                }

                else if (
                    !indexUp && !middleUp && !ringUp && !pinkyUp
                ) {
                    activeMeme = "fist";
                }

                else if (
                    indexUp && middleUp && !ringUp && !pinkyUp
                ) {
                    activeMeme = "question";
                }

                else if (
                    indexUp && middleUp && ringUp && !pinkyUp
                ) {
                    activeMeme = "shocked";
                }
            }

            if ( //if found and theres and an image
                activeMeme && memeFiles[activeMeme] 
            ) {
                memeOverlay.src = memeFiles[activeMeme];
                memeOverlay.style.display = "block"; //put it in
            } else {
                memeOverlay.style.display = "none"; //if not don't 
            }
        });

        const camera = new Camera( //this connects the cam to the cam element i made
            videoElement,
            {
                onFrame: async () => { //this is like every frame you do that
                    await hands.send({
                        image: videoElement //and this takes the cam frame and puts it to media pipe
                    });
                },
                width: 640,
                height: 480
            }
        );
        camera.start();
    </script>
</body>
</html>
